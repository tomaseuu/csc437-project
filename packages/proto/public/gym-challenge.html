<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Showdown Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400&family=Roboto+Slab:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/page.css" />
    <link rel="stylesheet" href="/styles/layout.css" />
    <link rel="stylesheet" href="/styles/cards.css" />
  </head>
  <body>
    <auth-provider>
      <header class="site-header">
        <div class="header-title">
          <a class="app-name" href="index.html">Habit Challenges</a>
          <div class="header-copy">
            <p class="header-kicker">Challenge</p>
            <h1>Gym Showdown Challenge</h1>
            <p>A 30-day habit challenge between two friends focused on gym goals.</p>
          </div>
        </div>

        <nav class="site-nav" aria-label="Primary navigation">
          <a href="index.html">Challenges</a>
          <a href="gym-challenge.html" aria-current="page">Gym</a>
          <a href="mindfulness-challenge.html">Mindfulness</a>
        </nav>

        <header-auth class="user-profile" aria-label="Current user"></header-auth>
      </header>

      <main class="page-grid">
        <challenge-overview-loader
          src="/data/gym-challenge.json"
        ></challenge-overview-loader>
      </main>
    </auth-provider>
    <script type="importmap">
      {
        "imports": {
          "@unbndl/auth": "https://unpkg.com/@unbndl/auth",
          "@unbndl/html": "https://unpkg.com/@unbndl/html",
          "@unbndl/view": "https://unpkg.com/@unbndl/view"
        }
      }
    </script>

    <script type="module">
      import { define } from "@unbndl/html";
      import { Auth } from "@unbndl/auth";
      import { ChallengeOverviewElement } from "/js/challenge-overview.js";
      import { HeaderElement } from "/js/header.js";
      import "/js/challenge-overview-loader.js?v=2";

      define({
        "auth-provider": Auth.Provider,
        "challenge-overview": ChallengeOverviewElement,
        "header-auth": HeaderElement
      });
    </script>
  </body>
</html>
