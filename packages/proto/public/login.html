<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400&family=Roboto+Slab:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/page.css" />
    <link rel="stylesheet" href="/styles/cards.css" />
    <script type="importmap">
      {
        "imports": {
          "@unbndl/auth": "https://unpkg.com/@unbndl/auth",
          "@unbndl/html": "https://unpkg.com/@unbndl/html",
          "@unbndl/view": "https://unpkg.com/@unbndl/view"
        }
      }
    </script>
    <script type="module">
      import { define } from "@unbndl/html";
      import { Auth } from "@unbndl/auth";
      import { LoginFormElement } from "/js/login-form.js";

      define({
        "auth-provider": Auth.Provider,
        "login-form": LoginFormElement
      });
    </script>
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: var(--space-xl);
      }

      auth-provider {
        display: grid;
        gap: var(--space-md);
        width: min(100%, 30rem);
      }

      h2 {
        text-align: center;
      }

      .content-card {
        gap: var(--space-md);
      }

      login-form {
        display: block;
      }

      login-form label {
        display: grid;
        gap: var(--space-2xs);
      }

      login-form input {
        width: 100%;
        padding: var(--space-sm);
        border: 1px solid var(--color-border);
        border-radius: 8px;
        font: inherit;
      }

      p {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <auth-provider>
      <h2>User Login</h2>
      <main class="content-card">
        <login-form api="/auth/login">
          <label>
            <span>Username:</span>
            <input name="username" autocomplete="off" />
          </label>
          <label>
            <span>Password:</span>
            <input type="password" name="password" />
          </label>
        </login-form>
      </main>
      <p>
        Or did you want to <a href="register.html">Register as a new user</a>?
      </p>
    </auth-provider>
  </body>
</html>
