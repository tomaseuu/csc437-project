<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindfulness Duel Challenge</title>
    <link rel="stylesheet" href="/styles/reset.css" />
